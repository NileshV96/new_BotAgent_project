[project]
name = "chatbot-multiagent-mcp"
version = "0.1.0"
description = "Minimal multi-agent chatbot with MCP tools using LangChain + LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "langchain>=0.2.16",
  "langchain-openai>=0.1.22",
  "langgraph>=0.2.35",
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "duckduckgo-search>=6.3.0",
]

[tool.setuptools]
packages = ["app"]

